<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenota Appuntamento - Tripo Arredamenti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdfdfd;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 30px;
    }
    header img {
      max-width: 250px;
    }
    h1 {
      color: #0a2d57;
      margin-top: 10px;
    }
    p {
      font-size: 1.2em;
      margin: 20px;
    }
    a.button {
      display: inline-block;
      padding: 15px 30px;
      background-color: #0a5491;
      color: white;
      text-decoration: none;
      font-size: 1.2em;
      border-radius: 8px;
      transition: background 0.3s;
    }
    a.button:hover {
      background-color: #083e6c;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Tripo Arredamenti Logo">
    <h1>Prenota il tuo Appuntamento in Store</h1>

  <main>
    <p>Compila il modulo email cliccando sul pulsante qui sotto e scegli data e ora che preferisci. Ti ricontatteremo per confermare la prenotazione.</p>
    <a class="button" href="mailto:info@tripoarredamenti.it?subject=Prenotazione%20Appuntamento%20in%20Store&body=Nome:%0ATelefono:%0AServizio%20richiesto:%0AData%20preferita:%0AOra%20preferita:%0ANote:">
